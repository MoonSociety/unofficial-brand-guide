name: Validate brand manifest

# Guards the single-source-of-truth invariant: brand.json must validate against
# the schema, its hand-keyed accessibility ratios must recompute correctly, and
# the derived files (colors.css, colors.json, tokens.json, llms.txt) must be in
# sync with brand.json. If a contributor edited a derived file by hand — or
# edited brand.json without regenerating — this job fails the build.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate + sync check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install schema validators (AJV)
        run: npm install --no-save ajv ajv-formats

      - name: Validate brand.json (schema + recomputed contrast ratios)
        run: node scripts/validate-manifest.mjs

      - name: Check derived files are in sync with brand.json
        run: node scripts/generate-derived.mjs --check
